  <!-- DACH MAL text -->
  <text x="100" y="68" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" fill="#cc1111" text-anchor="middle" letter-spacing="1">DACH MAL</text>
  <!-- SERVIS text -->
  <text x="100" y="86" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" fill="#cc1111" text-anchor="middle" letter-spacing="1">SERVIS</text>
</svg>
